# FOG ProxyDHCP configuration

# Network interface where PXE clients are visible.
# Examples: eth0, ens18, enp3s0
interface = "eno1"

# Real FOG server IP address. This can be a different machine than this proxy.
fog_ip = "192.168.24.2"

# FOG default boot files.
# Common FOG/iPXE alternatives. Uncomment the pair that fits your clients.
#
# Legacy BIOS:
# - undionly.kpxe   default FOG BIOS chainloader, uses the NIC PXE/UNDI stack.
# - undionly.kkpxe  BIOS fallback for systems that need more PXE stack kept loaded.
# - ipxe.kpxe       BIOS chainloader with native iPXE drivers.
# - ipxe.kkpxe      BIOS fallback variant with more PXE stack kept loaded.
#
# UEFI:
# - snponly.efi     common FOG UEFI choice, uses the firmware SNP driver.
# - ipxe.efi        UEFI iPXE with native drivers.
# - snp.efi         UEFI SNP variant that can try more than the boot NIC.
#
# FOG may include additional NIC-specific files in /tftpboot, such as
# intel.pxe, intel.efi, realtek.kpxe, realtek.kkpxe, and realtek.efi.
bootfile_bios = "undionly.kpxe"
bootfile_uefi = "ipxe.efi"

# Optional boot rules. Rules are checked from top to bottom. The first matching
# mac_prefix wins. Prefixes can use ":" "-" "." separators or no separators.
#
# Example: VirtualBox NICs usually start with 08:00:27.
#
# [[boot_rule]]
# name = "virtualbox"
# mac_prefix = "08:00:27"
# bootfile_bios = "ipxe.kpxe"
# bootfile_uefi = "snponly.efi"
#
# Example: only override UEFI for one vendor; BIOS falls back to bootfile_bios.
#
# [[boot_rule]]
# name = "uefi-snp-clients"
# mac_prefix = "52:54:00"
# bootfile_uefi = "snponly.efi"

# Standard ProxyDHCP/PXE ports.
# Port 67 receives DHCPDISCOVER broadcasts.
# Port 4011 handles PXE DHCPREQUEST traffic used by many firmwares.
listen_dhcp_port = 67
listen_pxe_port = 4011

# Keep true unless you know your clients do not require PXE port 4011.
enable_pxe_port = true
